name: mindforge_client
description: Mindforge Flutter client for Android, desktop and web.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  app_links: 7.0.0
  flutter:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  flutter_markdown_plus: 1.0.12
  gotrue: 2.27.2
  http: 1.6.0
  markdown: 7.3.1
  path_provider: 2.1.6
  url_launcher: 6.3.2
  web: 1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
