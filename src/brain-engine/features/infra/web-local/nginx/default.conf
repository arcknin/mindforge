server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    access_log off;
    error_log /dev/stderr crit;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Authorization $http_authorization;
    proxy_redirect off;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location = /auth {
        return 404;
    }

    location ^~ /auth/ {
        return 404;
    }

    location = /api/v1/auth/authorize {
        if ($request_uri ~ "^[^?]*%") { return 404; }
        limit_except GET { deny all; }
        proxy_pass http://mindforge-brain-engine-develop-brain-engine-develop-1:8080/v1/auth/authorize;
    }

    location = /api/v1/auth/callback {
        if ($request_uri ~ "^[^?]*%") { return 404; }
        limit_except GET { deny all; }
        proxy_pass http://mindforge-brain-engine-develop-brain-engine-develop-1:8080/v1/auth/callback;
    }

    location = /api/v1/auth/token {
        if ($request_uri ~ "^[^?]*%") { return 404; }
        limit_except POST { deny all; }
        proxy_pass http://mindforge-brain-engine-develop-brain-engine-develop-1:8080/v1/auth/token;
    }

    location = /api/v1/auth/user {
        if ($request_uri ~ "^[^?]*%") { return 404; }
        limit_except GET { deny all; }
        proxy_pass http://mindforge-brain-engine-develop-brain-engine-develop-1:8080/v1/auth/user;
    }

    location = /api/v1/auth/logout {
        if ($request_uri ~ "^[^?]*%") { return 404; }
        limit_except POST { deny all; }
        proxy_pass http://mindforge-brain-engine-develop-brain-engine-develop-1:8080/v1/auth/logout;
    }

    location = /api {
        return 404;
    }

    location = /api/v1/me/brain {
        limit_except GET PUT { deny all; }
        proxy_pass http://mindforge-brain-engine-develop-brain-engine-develop-1:8080/v1/me/brain;
    }

    location = /api/v1/me/brain/layers {
        limit_except POST { deny all; }
        proxy_pass http://mindforge-brain-engine-develop-brain-engine-develop-1:8080/v1/me/brain/layers;
    }

    location ~ ^/api/v1/me/brain/layers/[^/]+$ {
        limit_except PATCH { deny all; }
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://mindforge-brain-engine-develop-brain-engine-develop-1:8080;
    }

    location /api/ {
        return 404;
    }

    location = /login/callback {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
