name: mindforge-studio

services:
  studio-main:
    image: supabase/studio:2026.09.07-sha-7996410
    restart: unless-stopped
    ports:
      - "127.0.0.1:18085:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: "http://meta-main:8080"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${STUDIO_MAIN_DB_NAME:?}
      POSTGRES_USER_READ_ONLY: ${STUDIO_MAIN_DB_USER:?}
      POSTGRES_USER_READ_WRITE: ${STUDIO_MAIN_DB_USER:?}
      POSTGRES_PASSWORD: ${STUDIO_MAIN_DB_PASSWORD:?}
      PG_META_CRYPTO_KEY: ${STUDIO_MAIN_META_CRYPTO_KEY:?}
      AUTH_JWT_SECRET: ${STUDIO_MAIN_AUTH_JWT_SECRET:?}
      DEFAULT_ORGANIZATION_NAME: "Mindforge"
      DEFAULT_PROJECT_NAME: "Mindforge · Produção · ADMIN"
      NEXT_PUBLIC_IS_PLATFORM: "false"
      ENABLED_FEATURES_LOGS_ALL: "false"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})"
      timeout: 10s
      interval: 5s
      retries: 3
      start_period: 20s
    networks:
      - studio-main-admin
      - infra

  meta-main:
    image: supabase/postgres-meta:v0.99.0
    restart: unless-stopped
    environment:
      PG_META_HOST: "0.0.0.0"
      PG_META_PORT: "8080"
      PG_META_DB_HOST: "db"
      PG_META_DB_PORT: "5432"
      PG_META_DB_NAME: ${STUDIO_MAIN_DB_NAME:?}
      PG_META_DB_USER: ${STUDIO_MAIN_DB_USER:?}
      PG_META_DB_PASSWORD: ${STUDIO_MAIN_DB_PASSWORD:?}
      CRYPTO_KEY: ${STUDIO_MAIN_META_CRYPTO_KEY:?}
    networks:
      - studio-main-admin
      - infra

  studio-develop:
    image: supabase/studio:2026.09.07-sha-7996410
    restart: unless-stopped
    ports:
      - "127.0.0.1:18086:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: "http://meta-develop:8080"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${STUDIO_DEVELOP_DB_NAME:?}
      POSTGRES_USER_READ_ONLY: ${STUDIO_DEVELOP_DB_USER:?}
      POSTGRES_USER_READ_WRITE: ${STUDIO_DEVELOP_DB_USER:?}
      POSTGRES_PASSWORD: ${STUDIO_DEVELOP_DB_PASSWORD:?}
      PG_META_CRYPTO_KEY: ${STUDIO_DEVELOP_META_CRYPTO_KEY:?}
      AUTH_JWT_SECRET: ${STUDIO_DEVELOP_AUTH_JWT_SECRET:?}
      DEFAULT_ORGANIZATION_NAME: "Mindforge"
      DEFAULT_PROJECT_NAME: "Mindforge Develop · ADMIN"
      NEXT_PUBLIC_IS_PLATFORM: "false"
      ENABLED_FEATURES_LOGS_ALL: "false"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})"
      timeout: 10s
      interval: 5s
      retries: 3
      start_period: 20s
    networks:
      - studio-develop-admin
      - infra

  meta-develop:
    image: supabase/postgres-meta:v0.99.0
    restart: unless-stopped
    environment:
      PG_META_HOST: "0.0.0.0"
      PG_META_PORT: "8080"
      PG_META_DB_HOST: "db"
      PG_META_DB_PORT: "5432"
      PG_META_DB_NAME: ${STUDIO_DEVELOP_DB_NAME:?}
      PG_META_DB_USER: ${STUDIO_DEVELOP_DB_USER:?}
      PG_META_DB_PASSWORD: ${STUDIO_DEVELOP_DB_PASSWORD:?}
      CRYPTO_KEY: ${STUDIO_DEVELOP_META_CRYPTO_KEY:?}
    networks:
      - studio-develop-admin
      - infra

networks:
  studio-main-admin:
    internal: true
  studio-develop-admin:
    internal: true
  infra:
    name: infra_default
    external: true
