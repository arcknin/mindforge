services:
  db:
    platform: linux/amd64
    image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mindforge}
      POSTGRES_USER: ${POSTGRES_USER:-mindforge}
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      TZ: ${TZ:-UTC}
    ports:
      - "${DB_BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mindforge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  auth-migrate:
    image: supabase/gotrue:v2.196.0
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command: gotrue migrate
    environment:
      GOTRUE_DB_DRIVER: "postgres"
      GOTRUE_DB_DATABASE_URL: ${GOTRUE_DB_DATABASE_URL}
      DB_NAMESPACE: "auth"
      GOTRUE_DB_MAX_POOL_SIZE: ${GOTRUE_DB_MAX_POOL_SIZE:-10}
      GOTRUE_SITE_URL: ${GOTRUE_SITE_URL}
      GOTRUE_ADDITIONAL_REDIRECT_URLS: ${GOTRUE_ADDITIONAL_REDIRECT_URLS}
      GOTRUE_URI_ALLOW_LIST: ${GOTRUE_URI_ALLOW_LIST}
      GOTRUE_API_HOST: "0.0.0.0"
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${GOTRUE_API_EXTERNAL_URL}
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET}
      GOTRUE_OPERATOR_TOKEN: ${GOTRUE_OPERATOR_TOKEN}
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM:-false}

  auth:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
    command: gotrue serve
    environment:
      GOTRUE_DB_DRIVER: "postgres"
      GOTRUE_DB_DATABASE_URL: ${GOTRUE_DB_DATABASE_URL}
      DB_NAMESPACE: "auth"
      GOTRUE_DB_MAX_POOL_SIZE: ${GOTRUE_DB_MAX_POOL_SIZE:-10}
      GOTRUE_SITE_URL: ${GOTRUE_SITE_URL}
      GOTRUE_ADDITIONAL_REDIRECT_URLS: ${GOTRUE_ADDITIONAL_REDIRECT_URLS}
      GOTRUE_URI_ALLOW_LIST: ${GOTRUE_URI_ALLOW_LIST}
      GOTRUE_API_HOST: "0.0.0.0"
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${GOTRUE_API_EXTERNAL_URL}
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET}
      GOTRUE_OPERATOR_TOKEN: ${GOTRUE_OPERATOR_TOKEN}
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM:-false}
    ports:
      - "${AUTH_BIND_ADDR:-127.0.0.1}:${AUTH_PORT:-9999}:9999"
    healthcheck:
      test:
        - CMD-SHELL
        - |
          command -v wget >/dev/null 2>&1 || exit 1
          wget -q --spider "http://127.0.0.1:9999/health" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  mindforge-postgres-data:
