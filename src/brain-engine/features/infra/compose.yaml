services:
  db:
    platform: linux/amd64
    image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      MIND_FORGE_DEVELOP_DB: ${DEVELOP_DB_NAME}
      MIND_FORGE_DEVELOP_USER: ${DEVELOP_DB_USER}
      MIND_FORGE_DEVELOP_PASSWORD: ${DEVELOP_DB_PASSWORD}
      MIND_FORGE_MAIN_DB: ${MAIN_DB_NAME}
      MIND_FORGE_MAIN_USER: ${MAIN_DB_USER}
      MIND_FORGE_MAIN_PASSWORD: ${MAIN_DB_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${DB_BIND_ADDR}:${POSTGRES_PORT}:5432"
    volumes:
      - mindforge-postgres-data:/var/lib/postgresql/data
      - ./postgres/bootstrap:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d postgres -h 127.0.0.1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  auth-develop-migrate:
    image: supabase/gotrue:v2.196.0
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command: gotrue migrate
    environment:
      GOTRUE_DB_DRIVER: "postgres"
      GOTRUE_DB_DATABASE_URL: ${DEVELOP_AUTH_DB_URL}
      DB_NAMESPACE: "auth"
      GOTRUE_DB_MAX_POOL_SIZE: ${GOTRUE_DB_MAX_POOL_SIZE}
      GOTRUE_SITE_URL: ${DEVELOP_AUTH_SITE_URL}
      GOTRUE_ADDITIONAL_REDIRECT_URLS: ${DEVELOP_AUTH_ADDITIONAL_REDIRECT_URLS}
      GOTRUE_URI_ALLOW_LIST: ${DEVELOP_AUTH_URI_ALLOW_LIST}
      GOTRUE_API_HOST: "0.0.0.0"
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${DEVELOP_AUTH_API_EXTERNAL_URL}
      GOTRUE_JWT_SECRET: ${DEVELOP_AUTH_JWT_SECRET}
      GOTRUE_OPERATOR_TOKEN: ${DEVELOP_AUTH_OPERATOR_TOKEN}
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM}

  auth-develop:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      auth-develop-migrate:
        condition: service_completed_successfully
    command: gotrue serve
    environment:
      GOTRUE_DB_DRIVER: "postgres"
      GOTRUE_DB_DATABASE_URL: ${DEVELOP_AUTH_DB_URL}
      DB_NAMESPACE: "auth"
      GOTRUE_DB_MAX_POOL_SIZE: ${GOTRUE_DB_MAX_POOL_SIZE}
      GOTRUE_SITE_URL: ${DEVELOP_AUTH_SITE_URL}
      GOTRUE_ADDITIONAL_REDIRECT_URLS: ${DEVELOP_AUTH_ADDITIONAL_REDIRECT_URLS}
      GOTRUE_URI_ALLOW_LIST: ${DEVELOP_AUTH_URI_ALLOW_LIST}
      GOTRUE_API_HOST: "0.0.0.0"
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${DEVELOP_AUTH_API_EXTERNAL_URL}
      GOTRUE_JWT_SECRET: ${DEVELOP_AUTH_JWT_SECRET}
      GOTRUE_OPERATOR_TOKEN: ${DEVELOP_AUTH_OPERATOR_TOKEN}
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM}
    ports:
      - "${DEVELOP_AUTH_BIND_ADDR}:${DEVELOP_AUTH_PORT}:9999"
    healthcheck:
      test:
        - CMD-SHELL
        - |
          command -v wget >/dev/null 2>&1 || exit 1
          wget -q --spider "http://127.0.0.1:9999/health" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  auth-migrate:
    image: supabase/gotrue:v2.196.0
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command: gotrue migrate
    environment:
      GOTRUE_DB_DRIVER: "postgres"
      GOTRUE_DB_DATABASE_URL: ${MAIN_AUTH_DB_URL}
      DB_NAMESPACE: "auth"
      GOTRUE_DB_MAX_POOL_SIZE: ${GOTRUE_DB_MAX_POOL_SIZE}
      GOTRUE_SITE_URL: ${MAIN_AUTH_SITE_URL}
      GOTRUE_ADDITIONAL_REDIRECT_URLS: ${MAIN_AUTH_ADDITIONAL_REDIRECT_URLS}
      GOTRUE_URI_ALLOW_LIST: ${MAIN_AUTH_URI_ALLOW_LIST}
      GOTRUE_API_HOST: "0.0.0.0"
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${MAIN_AUTH_API_EXTERNAL_URL}
      GOTRUE_JWT_SECRET: ${MAIN_AUTH_JWT_SECRET}
      GOTRUE_OPERATOR_TOKEN: ${MAIN_AUTH_OPERATOR_TOKEN}
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM}

  auth:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
    command: gotrue serve
    environment:
      GOTRUE_DB_DRIVER: "postgres"
      GOTRUE_DB_DATABASE_URL: ${MAIN_AUTH_DB_URL}
      DB_NAMESPACE: "auth"
      GOTRUE_DB_MAX_POOL_SIZE: ${GOTRUE_DB_MAX_POOL_SIZE}
      GOTRUE_SITE_URL: ${MAIN_AUTH_SITE_URL}
      GOTRUE_ADDITIONAL_REDIRECT_URLS: ${MAIN_AUTH_ADDITIONAL_REDIRECT_URLS}
      GOTRUE_URI_ALLOW_LIST: ${MAIN_AUTH_URI_ALLOW_LIST}
      GOTRUE_API_HOST: "0.0.0.0"
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${MAIN_AUTH_API_EXTERNAL_URL}
      GOTRUE_JWT_SECRET: ${MAIN_AUTH_JWT_SECRET}
      GOTRUE_OPERATOR_TOKEN: ${MAIN_AUTH_OPERATOR_TOKEN}
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM}
    ports:
      - "${MAIN_AUTH_BIND_ADDR}:${MAIN_AUTH_PORT}:9999"
    healthcheck:
      test:
        - CMD-SHELL
        - |
          command -v wget >/dev/null 2>&1 || exit 1
          wget -q --spider "http://127.0.0.1:9999/health" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  mindforge-postgres-data:
