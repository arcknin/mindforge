              example:
                error:
                  code: internal
                  message: Não foi possível concluir a operação.
                request_id: example-request-id
        '503':
          description: Autenticação indisponível.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_envelope"
              example:
                error:
                  code: auth_unavailable
                  message: Autenticação indisponível.
                request_id: example-request-id
        '415':
          description: Formato de dados não suportado.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_envelope"
              example:
                error:
                  code: unsupported_media_type
                  message: Formato de dados não suportado.
                request_id: example-request-id
        '422':
          description: Informe um nome válido.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_envelope"
              example:
                error:
                  code: invalid_name
                  message: Informe um nome válido.
                request_id: example-request-id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/create_layer_request"
  "/v1/me/brain/layers/{layer_id}":
    patch:
      operationId: renameLayer
      tags:
      - Brain
      summary: Renomear camada usando a versão observada
      description: CAS altera nome/versão; preserva ID, parent e filhos. Não repetir
        cegamente. Versão stale409; timeout/conflito exige releitura e decisão antes
        de reaplicar.
      x-idempotency: Não repetir cegamente. Versão stale409; timeout/conflito exige
        releitura e decisão antes de reaplicar.
      x-reject-unknown-query-parameters: true
      x-max-body-bytes: 1048576
      x-no-engine-effects-on-auth-rejection: true
      responses:
        '200':
          description: Operação confirmada.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/layer_envelope"
        '400':
          description: Solicitação inválida.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_envelope"
              example:
                error:
                  code: invalid_request
                  message: Solicitação inválida.
                request_id: example-request-id
        '401':
          description: Autenticação necessária.
          content:
            application/json:
