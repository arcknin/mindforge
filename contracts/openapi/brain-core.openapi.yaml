        '400':
          description: Solicitação inválida.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_envelope"
              example:
                error:
                  code: invalid_request
                  message: Solicitação inválida.
                request_id: example-request-id
        '401':
          description: Autenticação necessária.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_envelope"
              example:
                error:
                  code: unauthenticated
                  message: Autenticação necessária.
                request_id: example-request-id
        '404':
          description: Recurso não encontrado.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_envelope"
              example:
                error:
                  code: not_found
                  message: Recurso não encontrado.
                request_id: example-request-id
        '405':
          description: Método não permitido.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_envelope"
              example:
                error:
                  code: method_not_allowed
                  message: Método não permitido.
                request_id: example-request-id
        '413':
          description: Solicitação muito grande.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_envelope"
              example:
                error:
                  code: payload_too_large
                  message: Solicitação muito grande.
                request_id: example-request-id
        '500':
          description: Não foi possível concluir a operação.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_envelope"
              example:
                error:
                  code: internal
                  message: Não foi possível concluir a operação.
                request_id: example-request-id
        '503':
          description: Autenticação indisponível.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_envelope"
              example:
                error:
                  code: auth_unavailable
                  message: Autenticação indisponível.
                request_id: example-request-id
      x-request-body-forbidden: true
  "/v1/me/brain/layers":
    post:
      operationId: createLayer
      tags:
      - Brain
      summary: Criar uma camada ou subcamada
      description: Uma nova camada no parent indicado, ID próprio e versão1; nesting
        livre e nomes repetidos preservados. Não idempotente; sem chave de deduplicação.
        Não repetir após timeout/transporte/5xx.401 definitivo pré-Engine permite
        refresh/reenvio limitado.
      x-idempotency: Não idempotente; sem chave de deduplicação. Não repetir após
        timeout/transporte/5xx.401 definitivo pré-Engine permite refresh/reenvio limitado.
      x-reject-unknown-query-parameters: true
      x-max-body-bytes: 1048576
      x-no-engine-effects-on-auth-rejection: true
      responses:
        '201':
          description: Operação confirmada.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/layer_envelope"
        '400':
          description: Solicitação inválida.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_envelope"
              example:
                error:
                  code: invalid_request
                  message: Solicitação inválida.
