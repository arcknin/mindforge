              example:
                error:
                  code: internal
                  message: Não foi possível concluir a operação.
                request_id: example-request-id
        '503':
          description: Autenticação indisponível.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_envelope"
              example:
                error:
                  code: auth_unavailable
                  message: Autenticação indisponível.
                request_id: example-request-id
        '415':
          description: Formato de dados não suportado.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_envelope"
              example:
                error:
                  code: unsupported_media_type
                  message: Formato de dados não suportado.
                request_id: example-request-id
        '422':
          description: Informe um nome válido.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_envelope"
              example:
                error:
                  code: invalid_name
                  message: Informe um nome válido.
                request_id: example-request-id
        '409':
          description: A camada foi alterada. Atualize antes de tentar novamente.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_envelope"
              example:
                error:
                  code: conflict
                  message: A camada foi alterada. Atualize antes de tentar novamente.
                request_id: example-request-id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/rename_layer_request"
      parameters:
      - name: layer_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          description: ID opaco da camada.
components:
  securitySchemes:
    GoTrueAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Sessão GoTrue develop; Google ID/access tokens e credenciais admin
        não são aceitos. API verifica usuário por GET /user interno fixo antes do
        Engine. Não extrai owner de token sem verificar.
  schemas:
    root_ref:
      type: object
      additionalProperties: false
      required:
      - kind
      - id
      properties:
        kind:
          type: string
          enum:
          - root
        id:
          type: string
          minLength: 1
          description: ID opaco do root estrutural.
    parent_ref:
      type: object
      additionalProperties: false
      required:
      - kind
      - id
      properties:
        kind:
          type: string
          enum:
          - root
          - layer
        id:
          type: string
          minLength: 1
          description: ID opaco; recurso deve pertencer ao Brain do solicitante.
    brain_summary:
      type: object
      additionalProperties: false
      required:
      - id
      - root
      properties:
        id:
          type: string
          minLength: 1
        root:
          "$ref": "#/components/schemas/root_ref"
    layer:
      type: object
      additionalProperties: false
      required:
      - id
      - parent
      - name
      - version
      properties:
        id:
          type: string
          minLength: 1
        parent:
          "$ref": "#/components/schemas/parent_ref"
        name:
          type: string
          minLength: 1
          description: Nome normalizado pelo Engine, sem unicidade por nome.
        version:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
    brain_envelope:
      type: object
      additionalProperties: false
      required:
      - brain
      properties:
        brain:
          "$ref": "#/components/schemas/brain_summary"
    hierarchy_envelope:
      type: object
      additionalProperties: false
      required:
      - brain
      - layers
      properties:
        brain:
          "$ref": "#/components/schemas/brain_summary"
        layers:
          type: array
          items:
            "$ref": "#/components/schemas/layer"
          description: Somente layers; root separado, zero layers iniciais; ordem
            não expressa posição autoritativa.
    layer_envelope:
      type: object
      additionalProperties: false
      required:
      - layer
      properties:
        layer:
          "$ref": "#/components/schemas/layer"
    create_layer_request:
      type: object
      additionalProperties: false
      required:
      - parent
      - name
      properties:
        parent:
          "$ref": "#/components/schemas/parent_ref"
        name:
          type: string
          description: Vazio/whitespace é422; trim autoritativo no Engine.
    rename_layer_request:
      type: object
      additionalProperties: false
      required:
      - name
      - expected_version
      properties:
        name:
          type: string
          description: Vazio/whitespace é422; trim autoritativo no Engine.
        expected_version:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
    error_envelope:
      type: object
      additionalProperties: false
      required:
      - error
      - request_id
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - invalid_request
              - unauthenticated
              - not_found
              - method_not_allowed
              - payload_too_large
              - unsupported_media_type
              - invalid_name
              - conflict
              - internal
              - auth_unavailable
            message:
              type: string
              minLength: 1
        request_id:
          type: string
          minLength: 1
