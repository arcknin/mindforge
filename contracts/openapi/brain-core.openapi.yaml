---
openapi: 3.1.0
info:
  title: Mindforge Brain Core API
  version: 0.1.0
  description: Contrato aprovado para execução local pelo owner em08/10/2026. Runtime
    de produto permanece pendente. Google OAuth é intermediado pelo GoTrue develop;
    a API aceita apenas o access token GoTrue e deriva o próprio owner pela consulta
    ao Auth.
servers:
- url: "/"
  description: Origem configurada para develop; não define endpoint de produção.
tags:
- name: Brain
  description: Brain privado e camadas do próprio usuário.
security:
- GoTrueAccessToken: []
paths:
  "/v1/me/brain":
    put:
      operationId: bootstrapBrain
      tags:
      - Brain
      summary: Inicializar ou recuperar o próprio Brain
      description: Inicializar ou recuperar Brain/root único do owner, sem camada
        visível. Não migrar schema. Convergente por owner; repetir retorna o mesmo
        Brain/root. Sempre200, sem distinguir criação/repetição.
      x-idempotency: Convergente por owner; repetir retorna o mesmo Brain/root. Sempre200,
        sem distinguir criação/repetição.
      x-reject-unknown-query-parameters: true
      x-max-body-bytes: 1048576
      x-no-engine-effects-on-auth-rejection: true
      responses:
        '200':
          description: Operação confirmada.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/brain_envelope"
        '400':
          description: Solicitação inválida.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_envelope"
              example:
                error:
                  code: invalid_request
                  message: Solicitação inválida.
                request_id: example-request-id
        '401':
          description: Autenticação necessária.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_envelope"
              example:
                error:
                  code: unauthenticated
                  message: Autenticação necessária.
                request_id: example-request-id
        '404':
          description: Recurso não encontrado.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_envelope"
              example:
                error:
                  code: not_found
                  message: Recurso não encontrado.
                request_id: example-request-id
        '405':
          description: Método não permitido.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_envelope"
              example:
                error:
                  code: method_not_allowed
                  message: Método não permitido.
                request_id: example-request-id
        '413':
          description: Solicitação muito grande.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_envelope"
              example:
                error:
                  code: payload_too_large
                  message: Solicitação muito grande.
                request_id: example-request-id
        '500':
          description: Não foi possível concluir a operação.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_envelope"
              example:
                error:
                  code: internal
                  message: Não foi possível concluir a operação.
                request_id: example-request-id
        '503':
          description: Autenticação indisponível.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_envelope"
              example:
                error:
                  code: auth_unavailable
                  message: Autenticação indisponível.
                request_id: example-request-id
      x-request-body-forbidden: true
    get:
      operationId: observeBrain
      tags:
      - Brain
      summary: Consultar a hierarquia do próprio Brain
      description: none Read-only e seguro para repetir;404 se não inicializado; GET
        nunca faz bootstrap.
      x-idempotency: Read-only e seguro para repetir;404 se não inicializado; GET
        nunca faz bootstrap.
      x-reject-unknown-query-parameters: true
      x-max-body-bytes: 1048576
