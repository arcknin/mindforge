  openapi_contract: contracts/openapi/auth.openapi.yaml

- id: auth_logout
  owner: auth
  capability: Auth.LogoutCurrentSession
  lifecycle: implemented
  contract_status: approved
  implementation_status: implemented
  runtime_status: pending
  gate: null
  method: POST
  path: /v1/auth/logout
  authentication:
    "$ref": "#/proposal_profiles/own_brain_auth"
  authorization: Exigir session_id UUID nao nulo no bearer aceito pelo GoTrue; impedir fallback para logout global.
  request:
    content_type: application/json_when_body_present
    query:
      scope: {type: string, enum: [local], required: true}
    body: absent_or_empty_object
    unknown_fields: rejected
    duplicate_fields: rejected
  response: {success_status: 204, body: none}
  errors: '400 invalid_request;401 unauthenticated;404 not_found;405 method_not_allowed;413 payload_too_large;415 unsupported_media_type;500 internal;503 auth_unavailable'
