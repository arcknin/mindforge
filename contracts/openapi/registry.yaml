# API-only Auth: cinco rotas aprovadas pelo owner em2026-10-13; runtime independente.
- id: auth_authorize
  owner: auth
  capability: Auth.GoogleAuthorize
  lifecycle: verified
  contract_status: approved
  implementation_status: implemented
  runtime_status: verified
  gate: null
  method: GET
  path: /v1/auth/authorize
  authentication: Publico; tentativa Google PKCE, sem bearer obrigatorio.
  authorization: Google-only; redirect final em allowlist exata do servidor; upstream Auth develop fixo.
  request:
    body: none
    query:
      provider: {type: string, enum: [google], required: true}
      flow_type: {type: string, enum: [pkce], required: true}
      redirect_to: {type: string, required: true, validation: exact_server_allowlist}
      code_challenge: {type: string, required: true, validation: base64url_43_chars_32_bytes_no_padding}
      code_challenge_method: {type: string, enum: [s256], required: true}
    unknown_fields: rejected
    duplicate_fields: rejected
  response: {success_status: 302, body: none, location: validated_HTTPS_Google_authorize_with_API_callback}
  errors: '400 invalid_request;404 not_found;405 method_not_allowed;413 payload_too_large;500 internal;503 auth_unavailable'
  effects: Cria FlowState Google PKCE no GoTrue; nao cria Brain nem sessao API propria.
  idempotency: Nao idempotente; sem retry automatico; nova tentativa por acao explicita.
  producer: src/brain-engine/auth/facade.go + api/auth.go + cmd/brain-engine (implemented local)
  consumers: [src/mindforge-client/lib/auth]
  operational_evidence: [docs/features/brain/api-auth/vm-runtime-evidence.md]
  evidence:
    contract: [docs/features/brain/api-auth/spec-01-main.md]
    implementation: [src/brain-engine/auth/facade.go, src/brain-engine/api/auth.go, src/mindforge-client/lib/auth/gotrue_sdk_port.dart, docs/features/brain/api-auth/implementation-evidence.md]
    runtime: [docs/features/brain/api-auth/vm-runtime-evidence.md]
  approval: owner_api_auth_spec_and_five_routes_20261013
  openapi_contract: contracts/openapi/auth.openapi.yaml

- id: auth_callback
  owner: auth
  capability: Auth.GoogleCallback
  lifecycle: implemented
  contract_status: approved
  implementation_status: implemented
  runtime_status: pending
  gate: null
  method: GET
  path: /v1/auth/callback
  authentication: Publico; state/fluxo Google validado pelo GoTrue interno, sem bearer.
  authorization: Redirect final somente allowlist exata; state nao e identidade do principal.
  request:
    body: none
    query:
      state: {type: string, required: true, validation: canonical_UUID}
      code: {type: string, maxLength: 4096, required: xor_error}
      error: {type: string, required: xor_code}
      optional_google_fields: [error_description, error_uri, scope, authuser, prompt, hd, iss]
      issuer_when_present: https://accounts.google.com
    unknown_fields: rejected
    duplicate_fields: rejected
    forwarding: state_and_code_or_state_and_error_only_with_bounded_description
  response: {success_status: 302, body: none, location: exact_final_callback_with_code_or_sanitized_error_query_only}
  errors: '400 invalid_request;404 not_found;405 method_not_allowed;413 payload_too_large;500 internal;503 auth_unavailable'
  effects: GoTrue conclui OAuth Google e emite codigo PKCE; nao devolver tokens em URL.
  idempotency: Codigo/state consumiveis; sem retry automatico apos resultado incerto.
  producer: src/brain-engine/auth/facade.go + api/auth.go + cmd/brain-engine (implemented local)
  consumers: [Google_OAuth_browser, src/mindforge-client/lib/auth]
  operational_evidence: [docs/features/brain/api-auth/vm-runtime-evidence.md]
  evidence:
    contract: [docs/features/brain/api-auth/spec-01-main.md]
    implementation: [src/brain-engine/auth/facade.go, src/brain-engine/api/auth.go, src/mindforge-client/lib/auth/gotrue_sdk_port.dart, docs/features/brain/api-auth/implementation-evidence.md]
    runtime: []
  approval: owner_api_auth_spec_and_five_routes_20261013
  openapi_contract: contracts/openapi/auth.openapi.yaml

- id: auth_token
  owner: auth
  capability: Auth.ExchangeOrRefresh
  lifecycle: implemented
  contract_status: approved
  implementation_status: implemented
  runtime_status: pending
  gate: null
  method: POST
  path: /v1/auth/token
  authentication: Codigo+verifier PKCE ou refresh token no body; sem bearer obrigatorio.
  authorization: GoTrue develop valida grant; API verifica novo access token e elegibilidade antes de devolver sessao.
  request:
    content_type: application/json
    max_body_bytes: 16384
    query:
      grant_type: {type: string, enum: [pkce, refresh_token], required: true}
    body_union:
      pkce: {required: [auth_code, code_verifier], validation: code_max4096_verifier_RFC7636_43to128}
      refresh_token: {required: [refresh_token], validation: nonempty_max8192_bytes}
    unknown_fields: rejected
    duplicate_fields: rejected
  response:
    success_status: 200
    body: 'access_token,refresh_token,token_type=bearer,expires_in,expires_at,user; DTO minimo definido na spec; sem provider_token/provider_refresh_token/id_token ou metadata bruta'
  errors: '400 invalid_request;401 unauthenticated;404 not_found;405 method_not_allowed;413 payload_too_large;415 unsupported_media_type;500 internal;503 auth_unavailable'
  effects: Emissao/rotacao no GoTrue; API nao reassina JWT nem persiste sessao propria.
  idempotency: Nao idempotente; nenhum retry upstream pela API. SDK tem refresh single-flight/retry transitorio limitado; resultado incerto pode exigir novo login.
  producer: src/brain-engine/auth/facade.go + api/auth.go + cmd/brain-engine (implemented local)
  consumers: [src/mindforge-client/lib/auth]
  operational_evidence: [docs/features/brain/api-auth/vm-runtime-evidence.md]
  evidence:
    contract: [docs/features/brain/api-auth/spec-01-main.md]
    implementation: [src/brain-engine/auth/facade.go, src/brain-engine/api/auth.go, src/mindforge-client/lib/auth/gotrue_sdk_port.dart, docs/features/brain/api-auth/implementation-evidence.md]
    runtime: []
  approval: owner_api_auth_spec_and_five_routes_20261013
  openapi_contract: contracts/openapi/auth.openapi.yaml

