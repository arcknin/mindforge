---
schema_version: 1
state_model:
  lifecycle:
  - proposed
  - approved
  - implemented
  - verified
  contract_status:
  - proposed
  - approved
  implementation_status:
  - pending
  - implemented
  runtime_status:
  - pending
  - verified
  gate:
  -
  - needs_decision
proposal_spec: docs/features/brain/manual-online/spec-01-main.md
proposal_profiles:
  own_brain_auth:
    status: approved
    scheme: bearer
    credential: Access token GoTrue do develop; não token Google ou chave administrativa.
    verifier: GET /user no Auth develop interno fixo, sem redirects/cache positivo.
    eligible_identity: Auth200, id autoritativo, aud/role authenticated, conta confirmada
      e identidade Google; negar anônimo.
    principal: user.id retornado pelo Auth verificador; nunca owner/email/target do
      client.
    failure: 401 antes do Engine se token/identidade rejeitado; 503 se Auth indisponível/incompatível.
    logout_limit: Logout local não promete invalidação instantânea de access tokens
      já emitidos.
  own_brain_errors:
    status: approved
    envelope: "{error:{code,message},request_id}"
    shared:
      '400': invalid_request
      '401': unauthenticated
      '404': not_found
      '405': method_not_allowed
      '413': payload_too_large
      '415': unsupported_media_type
      '422': invalid_name
      '500': internal
      '503': auth_unavailable
    nondisclosure: Recurso alheio e ausente retornam o mesmo404, sem IDs/nomes/versões
      ou detalhes SQL/Auth.
proposal_definitions:
  root_ref:
    type: object
    additionalProperties: false
    required:
    - kind
    - id
    properties:
      kind:
        type: string
        enum:
        - root
      id:
        type: string
        minLength: 1
        description: ID opaco do root estrutural.
  parent_ref:
    type: object
    additionalProperties: false
    required:
    - kind
    - id
    properties:
      kind:
        type: string
        enum:
        - root
        - layer
      id:
        type: string
        minLength: 1
        description: ID opaco; recurso deve pertencer ao Brain do solicitante.
  brain_summary:
    type: object
    additionalProperties: false
    required:
    - id
    - root
    properties:
      id:
        type: string
        minLength: 1
      root:
        "$ref": "#/proposal_definitions/root_ref"
  layer:
    type: object
    additionalProperties: false
    required:
    - id
    - parent
    - name
    - version
    properties:
      id:
        type: string
        minLength: 1
      parent:
        "$ref": "#/proposal_definitions/parent_ref"
      name:
        type: string
        minLength: 1
        description: Nome normalizado pelo Engine, sem unicidade por nome.
      version:
        type: integer
        minimum: 1
        maximum: 9223372036854775807
  brain_envelope:
    type: object
    additionalProperties: false
    required:
    - brain
    properties:
      brain:
        "$ref": "#/proposal_definitions/brain_summary"
  hierarchy_envelope:
    type: object
    additionalProperties: false
    required:
    - brain
    - layers
    properties:
      brain:
        "$ref": "#/proposal_definitions/brain_summary"
      layers:
        type: array
        items:
          "$ref": "#/proposal_definitions/layer"
        description: Somente layers; root separado, zero layers iniciais; ordem não
          expressa posição autoritativa.
  layer_envelope:
    type: object
    additionalProperties: false
    required:
    - layer
    properties:
      layer:
        "$ref": "#/proposal_definitions/layer"
  create_layer_request:
    type: object
    additionalProperties: false
    required:
    - parent
    - name
    properties:
      parent:
        "$ref": "#/proposal_definitions/parent_ref"
      name:
        type: string
        description: Vazio/whitespace é422; trim autoritativo no Engine.
  rename_layer_request:
    type: object
    additionalProperties: false
    required:
    - name
    - expected_version
    properties:
      name:
        type: string
        description: Vazio/whitespace é422; trim autoritativo no Engine.
      expected_version:
        type: integer
        minimum: 1
        maximum: 9223372036854775807
endpoints:
- id: brain_bootstrap
  owner: brain
  capability: BrainCore.Bootstrap
  lifecycle: implemented
  contract_status: approved
  implementation_status: implemented
  runtime_status: pending
  gate:
  method: PUT
  path: "/v1/me/brain"
  authentication:
    "$ref": "#/proposal_profiles/own_brain_auth"
  authorization: Somente o próprio Brain; owner derivado do verificador.
  request:
    body: none
    query: none
    unknown_fields: rejected
  response:
    success_status: 200
    body:
      "$ref": "#/proposal_definitions/brain_envelope"
  errors:
    "$ref": "#/proposal_profiles/own_brain_errors"
  effects: Inicializar ou recuperar Brain/root único do owner, sem camada visível.
    Não migrar schema.
  idempotency: Convergente por owner; repetir retorna o mesmo Brain/root. Sempre200,
    sem distinguir criação/repetição.
  producer: src/brain-engine/api/handler.go + auth/gotrue.go + cmd/brain-engine; local
    implemented
  consumers:
  - 'src/mindforge-client/: Flutter native source + Web develop deployed; authenticated runtime pending'
  evidence:
    contract:
    - docs/features/brain/manual-online/spec-01-main.md
    - contracts/openapi/brain-core.openapi.yaml
    implementation:
    - src/brain-engine/api/handler.go
    - src/brain-engine/auth/gotrue.go
    - src/brain-engine/cmd/brain-engine/main.go
    - src/mindforge-client/lib/main.dart
    - docs/features/brain/manual-online/implementation-evidence.md
    runtime: []
  approval: owner_execution_request_20261008
  openapi_contract: contracts/openapi/brain-core.openapi.yaml
