---
openapi: 3.0.3
info:
  title: Mindforge API Auth
  version: 1.0.0
  description: Owner approved 2026-10-13. API-only Google PKCE and session facade.
    Spec docs/features/brain/api-auth/spec-01-main.md. Unknown routes denied; no admin/password/id_token/cookie
    auth. All Auth errors use flat stable envelope, independent from Core/documents.
    Query max8192 bytes; duplicate fields rejected; exact paths only. GoTrue upstream
    fixed privately to develop; no user-selected destinations or redirects.
servers:
- url: "/"
  description: Brain Engine origin; Web reverse proxy mounts under /api
tags:
- name: Auth
paths:
  "/v1/auth/authorize":
    get:
      operationId: auth_authorize
      tags:
      - Auth
      description: No request body. Unknown/duplicate query keys are rejected. Exact
        encoded path only. Google-only PKCE S256. Creates GoTrue FlowState; not idempotent,
        no automatic retry. Final redirect_to exact server allowlist; scopes/invite/linking/aud
        not accepted.
      security: []
      responses:
        '400':
          description: invalid_request; PKCE rejected is 400, not a successful login
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store, no-cache
            Referrer-Policy:
              schema:
                type: string
                enum:
                - no-referrer
            X-Content-Type-Options:
              schema:
                type: string
                enum:
                - nosniff
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: unauthenticated; definitive credential or identity rejection
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store, no-cache
            Referrer-Policy:
              schema:
                type: string
                enum:
                - no-referrer
            X-Content-Type-Options:
              schema:
                type: string
                enum:
                - nosniff
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: not_found
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store, no-cache
            Referrer-Policy:
              schema:
                type: string
                enum:
                - no-referrer
            X-Content-Type-Options:
              schema:
                type: string
                enum:
                - nosniff
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '405':
          description: method_not_allowed; Allow header
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store, no-cache
            Referrer-Policy:
              schema:
                type: string
                enum:
                - no-referrer
            X-Content-Type-Options:
              schema:
                type: string
                enum:
                - nosniff
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '413':
          description: payload_too_large
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store, no-cache
            Referrer-Policy:
              schema:
                type: string
                enum:
                - no-referrer
            X-Content-Type-Options:
              schema:
                type: string
                enum:
                - nosniff
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '415':
          description: unsupported_media_type
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store, no-cache
            Referrer-Policy:
              schema:
                type: string
                enum:
                - no-referrer
            X-Content-Type-Options:
              schema:
                type: string
                enum:
                - nosniff
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '500':
          description: internal
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store, no-cache
            Referrer-Policy:
              schema:
                type: string
                enum:
                - no-referrer
            X-Content-Type-Options:
              schema:
                type: string
                enum:
                - nosniff
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: auth_unavailable; transport, incompatible upstream, 5xx or
            rate limit; may follow a consumed grant
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store, no-cache
            Referrer-Policy:
              schema:
                type: string
                enum:
                - no-referrer
            X-Content-Type-Options:
              schema:
                type: string
                enum:
                - nosniff
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '302':
          description: Validated redirect only; no access/refresh/provider tokens
            in Location
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store, no-cache
            Referrer-Policy:
              schema:
                type: string
                enum:
                - no-referrer
            X-Content-Type-Options:
              schema:
                type: string
                enum:
                - nosniff
            Location:
              required: true
              schema:
                type: string
                format: uri
              description: Google authorization for authorize; exact allowlisted app
                callback for callback
      parameters:
      - name: provider
        in: query
        required: true
        schema:
          type: string
          enum:
          - google
      - name: flow_type
        in: query
        required: true
        schema:
          type: string
          enum:
          - pkce
      - name: redirect_to
        in: query
        required: true
        schema:
          type: string
        description: Exact configured callback URI, no wildcard/query/fragment/userinfo
      - name: code_challenge
        in: query
        required: true
        schema:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
        description: Must decode to 32 bytes without padding
      - name: code_challenge_method
        in: query
        required: true
        schema:
          type: string
          enum:
          - s256
  "/v1/auth/callback":
