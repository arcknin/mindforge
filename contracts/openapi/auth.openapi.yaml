  "/v1/auth/token":
    post:
      operationId: auth_token
      tags:
      - Auth
      description: Body max16384 UTF8 bytes, strict JSON without duplicates/trailing
        values. grant_type=pkce selects PkceRequest; refresh_token selects RefreshRequest.
