                - no-referrer
            X-Content-Type-Options:
              schema:
                type: string
                enum:
                - nosniff
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '500':
          description: internal
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store, no-cache
            Referrer-Policy:
              schema:
                type: string
                enum:
                - no-referrer
            X-Content-Type-Options:
              schema:
                type: string
                enum:
                - nosniff
