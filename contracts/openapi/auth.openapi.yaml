        fixed internal /user; sub/id must agree. Provider and id tokens removed. Response
        loss may require re-login; not exactly once.
      security: []
      responses:
        '400':
          description: invalid_request; PKCE rejected is 400, not a successful login
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store, no-cache
            Referrer-Policy:
