              schema:
                "$ref": "#/components/schemas/Error"
        '413':
          description: payload_too_large
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store, no-cache
            Referrer-Policy:
              schema:
                type: string
                enum:
                - no-referrer
            X-Content-Type-Options:
              schema:
