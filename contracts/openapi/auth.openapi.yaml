  "/v1/auth/logout":
    post:
      operationId: auth_logout
      tags:
      - Auth
      description: Revoke only current GoTrue session; nonzero valid session_id in
        verified bearer required, never fallback to global/others. Duplicate/unknown
        query rejected. Body absent or empty JSON object; max16384 bytes. Repeated
        logout may return401; existing access tokens may remain valid until expiry.
        Client clears local auth even on remote failure, preserving documents.
      security:
      - BearerAuth: []
      responses:
        '400':
          description: invalid_request; PKCE rejected is 400, not a successful login
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store, no-cache
            Referrer-Policy:
              schema:
                type: string
                enum:
                - no-referrer
            X-Content-Type-Options:
