            X-Content-Type-Options:
              schema:
                type: string
                enum:
                - nosniff
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '500':
          description: internal
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store, no-cache
            Referrer-Policy:
              schema:
                type: string
                enum:
                - no-referrer
            X-Content-Type-Options:
              schema:
                type: string
                enum:
                - nosniff
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: auth_unavailable; transport, incompatible upstream, 5xx or
            rate limit; may follow a consumed grant
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store, no-cache
            Referrer-Policy:
              schema:
                type: string
                enum:
                - no-referrer
            X-Content-Type-Options:
              schema:
                type: string
                enum:
                - nosniff
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '204':
          description: GoTrue confirmed current session logout; no body
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store, no-cache
            Referrer-Policy:
              schema:
                type: string
                enum:
                - no-referrer
            X-Content-Type-Options:
              schema:
                type: string
                enum:
                - nosniff
      parameters:
      - name: scope
        in: query
        required: true
        schema:
          type: string
          enum:
          - local
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: GoTrue develop access token
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - error_code
      - message
      - request_id
      properties:
        code:
          type: string
          minLength: 1
        error_code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        request_id:
          type: string
          minLength: 1
    User:
      type: object
      additionalProperties: false
      required:
      - id
      - aud
      - role
      - is_anonymous
      - created_at
      - email_confirmed_at
      - app_metadata
      - user_metadata
      properties:
        id:
          type: string
          format: uuid
        aud:
          type: string
          enum:
          - authenticated
        role:
          type: string
          enum:
          - authenticated
        is_anonymous:
          type: boolean
          enum:
          - false
        created_at:
          type: string
          format: date-time
        email_confirmed_at:
          type: string
          format: date-time
        email:
          type: string
          maxLength: 320
        app_metadata:
          type: object
          additionalProperties: false
          required:
          - provider
          - providers
          properties:
            provider:
              type: string
              enum:
              - google
            providers:
              type: array
              minItems: 1
              maxItems: 1
              items:
                type: string
                enum:
                - google
        user_metadata:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              maxLength: 255
            full_name:
              type: string
              maxLength: 255
    PkceRequest:
      type: object
      additionalProperties: false
      required:
      - auth_code
      - code_verifier
      properties:
        auth_code:
          type: string
          minLength: 1
          maxLength: 4096
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
          pattern: "^[A-Za-z0-9._~-]+$"
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 8192
    Session:
      type: object
      additionalProperties: false
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      - expires_at
      - user
      properties:
        access_token:
          type: string
          minLength: 1
        refresh_token:
          type: string
          minLength: 1
          maxLength: 8192
        token_type:
          type: string
          enum:
          - bearer
        expires_in:
          type: integer
          minimum: 1
        expires_at:
          type: integer
          minimum: 1
        user:
          "$ref": "#/components/schemas/User"
